<!DOCTYPE html>
<html>
<head>
<title>Mera Kharcha - Expense Tracker</title>
<style>
body { font-family: Arial; background: #f2f2f2; text-align: center; }
.box { background: white; width: 90%; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 15px; }
input, select { width: 90%; padding: 10px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; }
button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 8px; }
li { background: #eee; padding: 10px; margin: 5px; list-style: none; border-radius: 8px; display: flex; justify-content: space-between; }
.del { background: red; padding: 2px 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
<h2>💰 Mera Kharcha Tracker</h2>
<h3>Total Kharcha: Rs. <span id="total">0</span></h3>
<input type="text" id="name" placeholder="Kis cheez pe kharcha? Eg: Khana">
<input type="number" id="amount" placeholder="Kitne paise? Eg: 200">
<select id="category">
<option>Khana</option>
<option>Bus / Petrol</option>
<option>Books</option>
<option>Shopping</option>
<option>Other</option>
</select>
<br><br>
<button onclick="addExpense()">Add Karo +</button>
<ul id="list"></ul>
</div>
<script>
let expenses = JSON.parse(localStorage.getItem("myKharcha") || "[]");
function show() {
  let list = document.getElementById("list");
  list.innerHTML = "";
  let total = 0;
  expenses.forEach((e, i) => {
    total += Number(e.amount);
    let li = document.createElement("li");
    li.innerHTML = e.name + " - Rs." + e.amount + " (" + e.cat + ") <button class='del' onclick='delExp("+i+")'>X</button>";
    list.appendChild(li);
  });
  document.getElementById("total").innerText = total;
}
function addExpense() {
  let name = document.getElementById("name").value;
  let amount = document.getElementById("amount").value;
  let cat = document.getElementById("category").value;
  if(name == "" || amount == "") { alert("Pehle naam aur paise likho!"); return; }
  expenses.push({name: name, amount: amount, cat: cat});
  localStorage.setItem("myKharcha", JSON.stringify(expenses));
  show();
  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
}
function delExp(i) {
  expenses.splice(i, 1);
  localStorage.setItem("myKharcha", JSON.stringify(expenses));
  show();
}
show();
</script>
</body>
</html>
